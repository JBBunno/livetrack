
<!DOCTYPE html>
<!--
  LiveTrack push notification admin trigger.

  This is a standalone page for the ONE person who sends broadcasts.
  Keep it off the public app (host it separately, or just open it locally /
  from a private link) since the only real access control here is the
  passphrase, which is checked server-side by the GAS ADMIN_SECRET.

  Fill in GAS_ENDPOINT below before use.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LiveTrack — Send Notification</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; }
    h1 { font-size: 1.3rem; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 1rem; }
    button { margin-top: 20px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
    #status { margin-top: 16px; font-size: 0.95rem; }
    .ok { color: #1a7f37; }
    .err { color: #cf222e; }
  </style>
</head>
<body>
  <h1>LiveTrack — Send Notification</h1>

  <label for="secret">Admin passphrase</label>
  <input type="password" id="secret" autocomplete="off" />

  <label for="title">Title</label>
  <input type="text" id="title" placeholder="e.g. Please update the app" />

  <label for="body">Message</label>
  <textarea id="body" rows="4" placeholder="e.g. A new version is available — please refresh LiveTrack when convenient."></textarea>

  <button id="sendBtn">Send to all users</button>

  <div id="status"></div>

  <script>
    // Your deployed GAS Web App URL, ending in /exec
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycby0Ub48y7MF1y9soeHXPP7Kr8zuaiXfDA96SE0EDIbzF-9ozmoENxKIIwq4IOU033zkmQ/exec';

    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');

    sendBtn.addEventListener('click', async () => {
      const secret = document.getElementById('secret').value.trim();
      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();

      if (!secret || !title || !body) {
        statusEl.textContent = 'Fill in passphrase, title, and message.';
        statusEl.className = 'err';
        return;
      }

      sendBtn.disabled = true;
      statusEl.textContent = 'Sending…';
      statusEl.className = '';

      try {
        const resp = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'broadcast', secret, title, body })
        });
        const data = await resp.json();

        if (!data.ok) {
          statusEl.textContent = 'Error: ' + (data.error || 'unknown error');
          statusEl.className = 'err';
        } else {
          const r = data.results;
          statusEl.textContent = `Sent to ${r.sent} device(s), ${r.failed} failed.` +
            (r.errors && r.errors.length ? ' First error: ' + r.errors[0] : '');
          statusEl.className = 'ok';
        }
      } catch (err) {
        statusEl.textContent = 'Request failed: ' + err.message;
        statusEl.className = 'err';
      } finally {
        sendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
